<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solina String Ensemble – émulation</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#17110e;--panel:#2b2320;--panel2:#352b26;--wood:#6a3b1f;--wood2:#4a2713;--ink:#efe3cf;--dim:#a99a85;--amber:#e8903a;--wkey:#f2ead8;--bkey:#1b1512;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#d8cdbd}}
:root[data-theme="dark"]{--page:#17110e}
*{box-sizing:inherit}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"Jost","Century Gothic",Futura,sans-serif;display:flex;justify-content:center;padding:20px 12px}
.case{display:flex;width:100%;max-width:980px;border-radius:8px;overflow:hidden;box-shadow:0 14px 40px #0009}
.cheek{width:clamp(14px,3vw,34px);background:linear-gradient(90deg,var(--wood2),var(--wood) 50%,var(--wood2))}
.main{flex:1;min-width:0;background:var(--panel)}
.top{padding:18px 22px 22px;background:linear-gradient(var(--panel2),var(--panel))}
h1{margin:0 0 2px;font-size:clamp(24px,5vw,38px);font-weight:700;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--amber);font-size:.5em;margin-left:10px}
.sub{color:var(--dim);font-size:14px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:22px 34px;align-items:flex-end}
.grp{display:flex;gap:8px;align-items:flex-end}
.grp h2{width:100%;font-size:13px;font-weight:600;color:var(--amber);margin:0 0 6px}
.col{display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 14px/1 inherit;font-family:inherit;color:var(--ink);background:#1e1814;border:1px solid #0008;border-radius:4px;padding:26px 8px 8px;min-width:76px;cursor:pointer;position:relative;box-shadow:inset 0 -3px 0 #0006}
.tab::before{content:"";position:absolute;top:9px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#4b3a2d}
.tab[aria-pressed=true]{background:#3a2e27}
.tab[aria-pressed=true]::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tab:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.sl input{width:120px;accent-color:var(--amber)}
.kbd{position:relative;height:clamp(130px,26vw,190px);background:#000;padding:6px 6px 0;touch-action:none;user-select:none}
.wk{position:absolute;top:6px;bottom:0;background:linear-gradient(var(--wkey),#d9cfb8);border:1px solid #0006;border-radius:0 0 4px 4px;cursor:pointer}
.bk{position:absolute;top:6px;height:60%;background:linear-gradient(#3a2e27,var(--bkey));border-radius:0 0 3px 3px;z-index:2;cursor:pointer}
.wk.on{background:#e6b77d}.bk.on{background:#8a5a2b}
.note{padding:10px 22px 16px;font-size:13px;color:var(--dim);margin:0}
</style>
</head>
<body>
<div class="case"><div class="cheek"></div>
<div class="main">
<div class="top">
 <h1>Solina String Ensemble<small>émulation Web Audio</small></h1>
 <p class="sub">Registres, enveloppe et ensemble à trois lignes à retard. Jouez à la souris, au clavier (Z–M et Q–I) ou en MIDI.</p>
 <div class="row">
  <div class="grp"><h2>Registres</h2><div class="tabs" id="regs"></div></div>
  <div class="grp"><h2>Enveloppe</h2>
   <label class="sl">Crescendo<input id="atk" type="range" min="0" max="1" step=".01" value=".25"></label>
   <label class="sl">Sustain<input id="rel" type="range" min="0" max="1" step=".01" value=".4"></label></div>
  <div class="grp"><h2>Ensemble</h2>
   <div class="col"><button class="tab" id="ensOn" aria-pressed="true">Ensemble</button></div>
   <label class="sl">Intensité<input id="int" type="range" min="0" max="1" step=".01" value=".7"></label>
   <label class="sl">Vitesse<input id="spd" type="range" min="0" max="1" step=".01" value=".4"></label></div>
  <div class="grp"><h2>Sortie</h2><label class="sl">Volume<input id="vol" type="range" min="0" max="1" step=".01" value=".7"></label></div>
 </div>
</div>
<div class="kbd" id="kbd" aria-label="Clavier"></div>
<p class="note" id="status">Appuyez sur une touche pour démarrer le son.</p>
</div><div class="cheek"></div></div>
<script>
const REG={
 bass:{n:"Basse",f:[1,0,0],t:"lowpass",hz:450,q:.7,g:1.2},
 cello:{n:"Violoncelle",f:[0,1,0],t:"lowpass",hz:1100,q:.8,g:1},
 viola:{n:"Alto",f:[0,1,.4],t:"bandpass",hz:1500,q:.9,g:1.5},
 violin:{n:"Violon",f:[0,.6,1],t:"highpass",hz:1400,q:.5,g:.9},
 trumpet:{n:"Trompette",f:[0,1,.7],t:"bandpass",hz:2300,q:2.2,g:1.7},
 horn:{n:"Cor",f:[0,1,0],t:"bandpass",hz:700,q:1.6,g:1.6}};
const on={violin:true,viola:true};let ensOn=true;
let ctx,master,dry,wet,ensIn,regN={},lfos=[],dl=[],depth=[],voices=new Map();
const $=id=>document.getElementById(id);
const val=id=>+$(id).value;
const foot=()=>{const f=[0,0,0];for(const k in on)if(on[k])REG[k].f.forEach((v,i)=>f[i]=Math.max(f[i],v));return f};
function init(){
 if(ctx){if(ctx.state!=="running")ctx.resume();return}
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain();const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
 ensIn=ctx.createGain();dry=ctx.createGain();wet=ctx.createGain();ensIn.connect(dry);dry.connect(master);wet.connect(master);
 for(const k in REG){const r=REG[k],f=ctx.createBiquadFilter(),g=ctx.createGain();f.type=r.t;f.frequency.value=r.hz;f.Q.value=r.q;f.connect(g);g.connect(ensIn);regN[k]={f,g}}
 // trois lignes à retard, LFO lent + rapide déphasés de 120°
 for(let i=0;i<3;i++){const d=ctx.createDelay(.05);d.delayTime.value=.008+i*.0015;ensIn.connect(d);const wg=ctx.createGain();wg.gain.value=.5;d.connect(wg);wg.connect(wet);dl.push(d)}
 for(let s=0;s<2;s++)for(let i=0;i<3;i++){
  const o=ctx.createOscillator(),p=i*2*Math.PI/3,w=ctx.createPeriodicWave(new Float32Array([0,Math.sin(p)]),new Float32Array([0,Math.cos(p)]));
  o.setPeriodicWave(w);const g=ctx.createGain();o.connect(g);g.connect(dl[i].delayTime);o.start();lfos.push({o,s});depth.push({g,s})}
 applyAll();ctx.resume();$("status").textContent="Son actif."}
function applyAll(){
 if(!ctx)return;const t=ctx.currentTime;
 master.gain.setTargetAtTime(val("vol")**2*.9,t,.02);
 for(const k in regN)regN[k].g.gain.setTargetAtTime(on[k]?REG[k].g*.5:0,t,.03);
 const I=val("int"),S=val("spd");
 lfos.forEach(l=>l.o.frequency.setTargetAtTime(l.s?3.5+S*5:.3+S*1.3,t,.1));
 depth.forEach(d=>d.g.gain.setTargetAtTime(I*(d.s?.0004:.0028),t,.05));
 dry.gain.setTargetAtTime(ensOn?.6:1,t,.03);wet.gain.setTargetAtTime(ensOn?.7:0,t,.03);
 const f=foot();voices.forEach(v=>v.g.forEach((g,i)=>g.gain.setTargetAtTime(f[i],t,.03)))}
function noteOn(m){
 init();if(voices.has(m))return;const t=ctx.currentTime,fr=440*2**((m-69)/12),f=foot();
 const env=ctx.createGain();env.gain.value=0;const atk=.005*300**val("atk");
 env.gain.setTargetAtTime(.16,t,atk/3);
 const oscs=[],gs=[];
 [fr/2,fr,fr*2].forEach((hz,i)=>{const o=ctx.createOscillator();o.type="sawtooth";o.frequency.value=hz;o.detune.value=(Math.random()-.5)*6;
  const g=ctx.createGain();g.gain.value=f[i];o.connect(g);g.connect(env);o.start(t);oscs.push(o);gs.push(g)});
 for(const k in regN)env.connect(regN[k].f);
 voices.set(m,{env,oscs,g:gs});mark(m,1)}
function noteOff(m){
 const v=voices.get(m);if(!v)return;voices.delete(m);mark(m,0);
 const t=ctx.currentTime,rel=.08*40**val("rel");
 v.env.gain.cancelScheduledValues(t);v.env.gain.setTargetAtTime(0,t,rel/3);
 v.oscs.forEach(o=>o.stop(t+rel*1.6+.1));setTimeout(()=>v.env.disconnect(),(rel*1.6+.3)*1000)}
// interface
const regsEl=$("regs");
for(const k in REG){const b=document.createElement("button");b.className="tab";b.textContent=REG[k].n;b.setAttribute("aria-pressed",!!on[k]);
 b.onclick=()=>{on[k]=!on[k];b.setAttribute("aria-pressed",on[k]);init();applyAll()};regsEl.appendChild(b)}
$("ensOn").onclick=e=>{ensOn=!ensOn;e.currentTarget.setAttribute("aria-pressed",ensOn);init();applyAll()};
["atk","rel","int","spd","vol"].forEach(id=>$(id).addEventListener("input",()=>{init();applyAll()}));
const keyEls={},kbd=$("kbd"),WHITE=[0,2,4,5,7,9,11],LO=48,HI=84;
const isBlack=m=>![0,2,4,5,7,9,11].includes(m%12);
let wi=0;const nW=22,w=(100-1.3)/nW;
for(let m=LO;m<=HI;m++){const e=document.createElement("div");
 if(isBlack(m)){e.className="bk";e.style.width=w*.6+"%";e.style.left=`calc(.65% + ${wi*w-w*.3}%)`}
 else{e.className="wk";e.style.width=w+"%";e.style.left=`calc(.65% + ${wi*w}%)`;wi++}
 e.onpointerdown=ev=>{ev.target.releasePointerCapture?.(ev.pointerId);noteOn(m)};
 e.onpointerup=e.onpointerleave=e.onpointercancel=()=>noteOff(m);
 e.onpointerenter=ev=>{if(ev.buttons&1)noteOn(m)};
 kbd.appendChild(e);keyEls[m]=e}
function mark(m,s){keyEls[m]?.classList.toggle("on",!!s)}
const MAP={};"zsxdcvgbhnjm".split("").forEach((c,i)=>MAP[c]=48+i);"q2w3er5t6y7ui".split("").forEach((c,i)=>MAP[c]=60+i);
addEventListener("keydown",e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const m=MAP[e.key.toLowerCase()];if(m!==undefined){e.preventDefault();noteOn(m)}});
addEventListener("keyup",e=>{const m=MAP[e.key.toLowerCase()];if(m!==undefined)noteOff(m)});
try{navigator.requestMIDIAccess?.().then(a=>{a.inputs.forEach(i=>i.onmidimessage=ev=>{
 const [s,n,v]=ev.data,c=s&240;if(c===144&&v>0)noteOn(n);else if(c===128||c===144)noteOff(n)})}).catch(()=>{})}catch(e){}
</script>
</body>
</html>
