<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DM6 · émulateur de firmware FM-1</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9e6df;--panel:#f7f5f0;--panel2:#ebe7de;--ink:#1d1b18;--ink2:#6b655a;--line:#cdc7ba;
  --accent:#c2410c;--accent-ink:#fff;--on:#0f766e;--key-w:#fdfcf9;--key-b:#23211e;--key-on:#f59e0b;
  --lcd-bg:#cfd8c0;--lcd-fg:#26301f;--warn:#b45309;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311;--panel:#1d1b18;--panel2:#262320;--ink:#ece8df;--ink2:#9b9487;--line:#38342e;
  --accent:#f59e0b;--accent-ink:#1a1100;--on:#2dd4bf;--key-w:#e8e4da;--key-b:#12100e;--key-on:#f59e0b;
  --lcd-bg:#1a2a1c;--lcd-fg:#9be58a;--warn:#fbbf24;}}
:root[data-theme="dark"]{
  --bg:#141311;--panel:#1d1b18;--panel2:#262320;--ink:#ece8df;--ink2:#9b9487;--line:#38342e;
  --accent:#f59e0b;--accent-ink:#1a1100;--on:#2dd4bf;--key-w:#e8e4da;--key-b:#12100e;--key-on:#f59e0b;
  --lcd-bg:#1a2a1c;--lcd-fg:#9be58a;--warn:#fbbf24;}
html,body{height:auto;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 14px}
header h1{font-size:16px;margin:0;letter-spacing:.02em}
header h1 small{font-weight:400;color:var(--ink2);margin-left:6px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 11px;cursor:pointer;min-height:32px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.on{background:var(--on);color:#fff;border-color:var(--on)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.step:focus-visible,.knob:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.chip b{color:var(--ink)}
select,input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-height:30px}
main{max-width:1180px;margin:0 auto;padding:14px 14px 40px}
.banner{background:var(--panel2);border:1px solid var(--warn);color:var(--ink);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.banner[hidden]{display:none}
.front{display:grid;grid-template-columns:240px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
@media (max-width:760px){.front{grid-template-columns:1fr}}
.screen{width:240px;height:240px;max-width:100%;border-radius:6px;border:4px solid #0007;background:var(--lcd-bg);image-rendering:pixelated;display:block}
.macros{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.mk{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink2);text-align:center}
.knob{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4b4741,#171513);border:2px solid #0008;position:relative;cursor:ns-resize;touch-action:none}
.knob i{position:absolute;left:50%;top:5px;width:3px;height:14px;margin-left:-1.5px;background:var(--key-on);border-radius:2px;transform-origin:50% 17px}
.mk output{font:11px ui-monospace,Menlo,monospace;color:var(--ink)}
.kbwrap{display:flex;gap:10px;align-items:stretch}
.kb{position:relative;flex:1;height:120px;user-select:none;touch-action:none}
.k{position:absolute;top:0;border:1px solid #0006;border-radius:0 0 4px 4px;cursor:pointer}
.k.w{background:var(--key-w);height:100%}
.k.b{background:var(--key-b);height:62%;z-index:2}
.k.on{background:var(--key-on)!important}
.k span{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:#6b655a;pointer-events:none}
.wheels{display:flex;gap:8px}
.wheels label{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink2);gap:3px}
.wheels input[type=range]{writing-mode:vertical-lr;direction:rtl;height:96px;width:22px}
.kbtools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;color:var(--ink2);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
nav.tabs button{padding:7px 14px;border:1px solid var(--line);border-bottom-width:2px;background:var(--panel2);border-radius:8px 8px 0 0;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--panel);border-bottom-color:var(--accent);font-weight:600}
.tab[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.row{display:grid;grid-template-columns:104px 1fr 62px;gap:8px;align-items:center;min-height:28px}
.row .lab{font-size:12.5px;color:var(--ink2)}
.row output,.val{font:12px ui-monospace,Menlo,Consolas,monospace;text-align:right}
.row.sel{grid-template-columns:104px 1fr}
.row input[type=range]{width:100%;accent-color:var(--accent)}
details summary{cursor:pointer;font-size:12px;color:var(--ink2);margin:4px 0}
.mx{display:grid;grid-template-columns:28px 1fr 1fr 1.4fr 56px;gap:6px;align-items:center;margin-bottom:6px}
.mx .n{color:var(--ink2);font:12px ui-monospace,monospace}
.mx.lane .n{color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:8px 0}
@media (max-width:760px){.steps{grid-template-columns:repeat(8,1fr)}}
.step{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:5px;min-height:46px;padding:2px;cursor:pointer;font:11px ui-monospace,Menlo,monospace;text-align:center;color:var(--ink)}
.step.g4{border-left:2px solid var(--ink2)}
.step.off{opacity:.35}
.step.sel{outline:2px solid var(--accent)}
.step.play{background:var(--on);color:#fff}
.step .vb{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:var(--accent);border-radius:2px;transform-origin:left}
.step small{display:block;color:var(--ink2);font-size:9px;line-height:1.1}
.step.play small{color:#fff}
.insp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.insp label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink2)}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
@media (max-width:520px){.lanes{grid-template-columns:1fr}}
canvas.lane{width:100%;height:84px;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
.lt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.lt .btn{padding:2px 8px;min-height:26px;font-size:12px}
textarea{width:100%;min-height:120px;font:12px ui-monospace,Menlo,monospace}
.note{color:var(--ink2);font-size:12px}
kbd{font:11px ui-monospace,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<header>
  <h1>DM6<small>émulateur de firmware FM-1 · moteur C → WebAssembly</small></h1>
  <button class="btn primary" id="startBtn">▶ Démarrer l’audio</button>
  <select id="presetSel" aria-label="Préréglage"></select>
  <span class="sp"></span>
  <span class="chip">voix <b id="cVoices">0</b>/<b id="cMax">6</b></span>
  <span class="chip"><b id="cRate">–</b> Hz</span>
  <button class="btn" id="themeBtn" aria-label="Changer de thème">◐</button>
</header>
<main>
  <div class="banner" id="banner" hidden></div>
  <section class="front" aria-label="Face avant FM-1">
    <canvas id="screen" class="screen" width="240" height="240" aria-label="Écran 240 par 240"></canvas>
    <div>
      <div class="macros" id="macros"></div>
      <div class="kbwrap">
        <div class="kb" id="kb" role="group" aria-label="Clavier de 27 touches"></div>
        <div class="wheels">
          <label>Pitch<input type="range" id="bendW" min="-100" max="100" value="0" aria-label="Pitch bend"></label>
          <label>Mod<input type="range" id="modW" min="0" max="127" value="0" aria-label="Molette de modulation"></label>
        </div>
      </div>
      <div class="kbtools">
        <button class="btn" id="octDn" aria-label="Octave plus bas">Oct −</button>
        <b id="octLab">C3</b>
        <button class="btn" id="octUp" aria-label="Octave plus haut">Oct +</button>
        <button class="btn" id="panicBtn">Tout couper</button>
        <span>Clavier d’ordinateur : rangées <kbd>Z…/</kbd> et <kbd>Q…P</kbd> (positions physiques, fonctionne en AZERTY). <kbd>←</kbd><kbd>→</kbd> octave, <kbd>Espace</kbd> lecture.</span>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="tab-son" class="tab"></div>
  <div id="tab-mod" class="tab" hidden></div>
  <div id="tab-seq" class="tab" hidden></div>
  <div id="tab-cfg" class="tab" hidden></div>
</main>

<script>
/* SPDX-License-Identifier: GPL-3.0-only */
/* DMEngine: thin JS wrapper around build/dm6.wasm. The same source text runs in Node
 * (tests), inside the AudioWorklet, and on the main thread (fallback). */
class DMEngine {
  /* src: a compiled WebAssembly.Module or raw bytes (synchronous: Node, AudioWorklet),
   * or {instance} produced by DMEngine.create() (main thread: browsers forbid synchronous
   * compilation of modules larger than 4 KB there). */
  constructor(src) {
    if (src && src.instance) { this.inst = src.instance; this.holder = src.holder; this.module = src.module; }
    else {
      this.holder = {};
      const mod = (typeof WebAssembly.Module === 'function' && src instanceof WebAssembly.Module) ? src : new WebAssembly.Module(src);
      this.inst = new WebAssembly.Instance(mod, DMEngine._imports(this.holder)); this.module = mod;
    }
    this.x = this.holder.x = this.inst.exports;
    if (this.x._initialize) this.x._initialize();
    this.x.dm_w_init();
    this.sl = new Float32Array(4096); this.sr = new Float32Array(4096);
    this.avail = 0; this.pos = 0;
    this.names = [];
    const n = this.x.dm_w_param_count();
    for (let i = 0; i < n; i++) this.names.push(this._cstr(this.x.dm_w_param_name(i)));
  }
  static _imports(holder) {
    return { wasi_snapshot_preview1: {
      random_get(p, n) { const u = new Uint8Array(holder.x.memory.buffer, p, n); for (let i = 0; i < n; i++) u[i] = (Math.random() * 256) | 0; return 0; } } };
  }
  static async create(bytes) {
    const holder = {};
    const r = await WebAssembly.instantiate(bytes, DMEngine._imports(holder));
    return new DMEngine({ instance: r.instance, holder, module: r.module });
  }
  _cstr(p) {
    const m = new Uint8Array(this.x.memory.buffer); let s = '';
    while (m[p]) s += String.fromCharCode(m[p++]);
    return s;
  }
  /* [{id,name,min,max,val}] straight from the C table: single source of truth */
  params() {
    return this.names.map((name, id) => ({ id, name, min: this.x.dm_w_param_min(id), max: this.x.dm_w_param_max(id), val: this.x.dm_w_get(id) }));
  }
  defaults() {
    const d = { p: {}, mx: [], steps: [], lanes: [] };
    for (const q of this.params()) d.p[q.name] = q.val;
    for (let i = 0; i < 12; i++) d.mx.push([this.x.dm_w_mx_get(i, 0), this.x.dm_w_mx_get(i, 1), this.x.dm_w_mx_get(i, 2)]);
    for (let i = 0; i < 64; i++) d.steps.push({ n: [0, 1, 2, 3].map(f => this.x.dm_w_step_get(i, f)), v: this.x.dm_w_step_get(i, 4),
      g: this.x.dm_w_step_get(i, 5), r: this.x.dm_w_step_get(i, 6), pr: this.x.dm_w_step_get(i, 7), t: this.x.dm_w_step_get(i, 8) });
    for (let l = 0; l < 4; l++) {
      const L = { val: [] };
      ['len', 'div', 'dir', 'mode', 'lock', 'slew', 'depth', 'offset'].forEach((k, f) => { L[k] = this.x.dm_w_lane_get(l, f); });
      for (let i = 0; i < 64; i++) L.val.push(this.x.dm_w_lane_val_get(l, i));
      d.lanes.push(L);
    }
    return d;
  }
  handle(m) {
    const x = this.x;
    switch (m.t) {
      case 'set': x.dm_w_set(m.id, m.v); break;
      case 'mx': x.dm_w_mx_set(m.slot, m.src, m.dst, m.amt); break;
      case 'step': x.dm_w_step_set(m.i, m.f, m.v); break;
      case 'lane': x.dm_w_lane_set(m.l, m.f, m.v); break;
      case 'laneval': x.dm_w_lane_val(m.l, m.i, m.v); break;
      case 'on': x.dm_w_note_on(m.n, m.v); break;
      case 'off': x.dm_w_note_off(m.n); break;
      case 'alloff': x.dm_w_all_off(); break;
      case 'wheel': x.dm_w_wheel(m.v); break;
      case 'after': x.dm_w_after(m.v); break;
      case 'bend': x.dm_w_bend(m.v); break;
      case 'bpm': x.dm_w_bpm(m.v); break;
      case 'mode': x.dm_w_play_mode(m.v); break;
      case 'ext': x.dm_w_ext(m.v); break;
      case 'start': x.dm_w_start(); break;
      case 'stop': x.dm_w_stop(); break;
      case 'cont': x.dm_w_continue(); break;
      case 'pulse': x.dm_w_pulse(); break;
    }
  }
  info() { const o = []; for (let k = 0; k <= 14; k++) o.push(this.x.dm_w_info(k)); return o; }

  /* exact 44.1 kHz render, interleaved float32 (used by the bit-exact test) */
  renderRaw(frames) {
    const out = new Float32Array(frames * 2);
    for (let o = 0; o < frames; o += 256) {
      this.x.dm_w_render(256);
      out.set(new Float32Array(this.x.memory.buffer, this.x.dm_w_out(), 512), o * 2);
    }
    return out;
  }
  _fill() {
    this.x.dm_w_render(256);
    const o = new Float32Array(this.x.memory.buffer, this.x.dm_w_out(), 512);
    for (let k = 0; k < 256; k++) { this.sl[this.avail + k] = o[2 * k]; this.sr[this.avail + k] = o[2 * k + 1]; }
    this.avail += 256;
  }
  /* fill outL/outR for an audio context running at `rate` (linear resampling from 44.1 kHz) */
  pull(outL, outR, n, rate) {
    const step = 44100 / rate;
    for (let i = 0; i < n; i++) {
      const i0 = Math.floor(this.pos);
      while (this.avail < i0 + 2) this._fill();
      const f = this.pos - i0;
      outL[i] = this.sl[i0] + (this.sl[i0 + 1] - this.sl[i0]) * f;
      outR[i] = this.sr[i0] + (this.sr[i0 + 1] - this.sr[i0]) * f;
      this.pos += step;
    }
    const drop = Math.floor(this.pos);
    if (drop > 0) {
      this.sl.copyWithin(0, drop, this.avail); this.sr.copyWithin(0, drop, this.avail);
      this.avail -= drop; this.pos -= drop;
    }
  }
}
if (typeof module !== 'undefined') module.exports = { DMEngine };

</script>

    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);

const S = { range: {}, ids: {}, p: {}, mx: [], steps: [], lanes: [], bpm10: 1200, pmode: 0, ext: false,
            info: new Array(15).fill(0), bus: null, ctx: null, started: false, base: 48, sel: 0,
            stepEdit: false, clip: null, name: "Init", lit: new Map(), views: {}, DEF: null };

const bytes = () => Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));

async function initModel() {
  probe = await DMEngine.create(bytes());
  for (const q of probe.params()) { S.range[q.name] = [q.min, q.max]; S.ids[q.name] = q.id; }
  S.DEF = probe.defaults();
  loadModel({ p: S.DEF.p, mx: S.DEF.mx, steps: S.DEF.steps, lanes: S.DEF.lanes, bpm10: 1200, pmode: 0 }, false);
}
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function loadModel(m, send = true) {
  S.p = Object.assign({}, S.DEF.p);
  for (const k of Object.keys(m.p || {})) if (k in S.range) S.p[k] = clamp(Math.round(+m.p[k]), S.range[k][0], S.range[k][1]);
  S.mx = copy(m.mx || S.DEF.mx); while (S.mx.length < 12) S.mx.push([0, 0, 0]);
  S.steps = copy(m.steps || S.DEF.steps);
  S.lanes = copy(m.lanes || S.DEF.lanes);
  S.bpm10 = clamp(Math.round(m.bpm10 || 1200), 300, 3000);

}
function post(m) { if (S.bus) S.bus(m); }
function replay() {
  post({ t: "alloff" });
  for (const k in S.p) post({ t: "set", id: S.ids[k], v: S.p[k] });
  S.mx.forEach((r, slot) => post({ t: "mx", slot, src: r[0], dst: r[1], amt: r[2] }));
  S.steps.forEach((s, i) => sendStep(i));
  S.lanes.forEach((L, l) => { ["len", "div", "dir", "mode", "lock", "slew", "depth", "offset"].forEach((k, f) => post({ t: "lane", l, f, v: L[k] }));
    L.val.forEach((v, i) => post({ t: "laneval", l, i, v })); });
  post({ t: "bpm", v: S.bpm10 }); post({ t: "ext", v: S.ext ? 1 : 0 });
  post({ t: "mode", v: S.pmode });
  if (S.pmode) post({ t: "start" });
}
function sendStep(i) {
  const s = S.steps[i];
  s.n.forEach((v, f) => post({ t: "step", i, f, v }));
  post({ t: "step", i, f: 4, v: s.v }); post({ t: "step", i, f: 5, v: s.g });
  post({ t: "step", i, f: 6, v: s.r }); post({ t: "step", i, f: 7, v: s.pr }); post({ t: "step", i, f: 8, v: s.t });
}

function refreshAll() { for (const k in S.views) S.views[k].forEach(f => f()); refreshSteps(); drawLanes(); updateMisc(); }
function setParam(name, v) {
  const [a, b] = S.range[name]; v = clamp(Math.round(v), a, b);

  const out = h("output", { class: "val" });
  const upd = () => { inp.value = S.p[name]; out.textContent = fmt ? fmt(S.p[name]) : S.p[name]; };
  inp.addEventListener("input", () => setParam(name, +inp.value));

  const c = (S.lit.get(n) || 1) - 1; if (c <= 0) S.lit.delete(n); else S.lit.set(n, c); litUpdate();
  post({ t: "off", n });
}
let kbEls = {};
function buildKb() {
  const kb = $("#kb"); kb.replaceChildren(); kbEls = {};
  const NK = 27, isBlack = n => [1, 3, 6, 8, 10].includes(n % 12);
  let whites = 0; for (let i = 0; i < NK; i++) if (!isBlack(S.base + i)) whites++;
  const w = 100 / whites; let wi = 0;
  for (let i = 0; i < NK; i++) {
    const n = S.base + i, black = isBlack(n);
    const el = h("div", { class: "k " + (black ? "b" : "w"), "data-n": n, role: "button", "aria-label": nname(n) });
    if (black) { el.style.left = (wi * w - w * 0.3) + "%"; el.style.width = (w * 0.6) + "%"; }
    else { el.style.left = (wi * w) + "%"; el.style.width = w + "%"; if (n % 12 === 0) el.append(h("span", { text: nname(n) })); wi++; }
    const down = e => { e.preventDefault(); el.setPointerCapture(e.pointerId); heldKeys.set("p" + e.pointerId, n); noteOn(n); };
    const up = e => { const k = "p" + e.pointerId; if (heldKeys.has(k)) { noteOff(heldKeys.get(k)); heldKeys.delete(k); } };
    el.addEventListener("pointerdown", down); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    kbEls[n] = el; kb.append(el);
  }
  $("#octLab").textContent = nname(S.base);
  litUpdate();
}
function litUpdate() { for (const n in kbEls) kbEls[n].classList.toggle("on", S.lit.has(+n) || +n === S.info[14]); }
document.addEventListener("keydown", e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" && e.target.type !== "range" && e.target.type !== "checkbox" || tag === "textarea" || tag === "select") return;
  if (e.code === "ArrowLeft" || e.code === "ArrowRight") { S.base = clamp(S.base + (e.code === "ArrowLeft" ? -12 : 12), 12, 84); buildKb(); e.preventDefault(); return; }
  if (e.code === "Space" && tag !== "button") { post({ t: S.info[8] ? "stop" : "start" }); e.preventDefault(); return; }
  if (e.code in KEYMAP && !heldKeys.has(e.code)) { const n = S.base + KEYMAP[e.code]; heldKeys.set(e.code, n); noteOn(n); }
});
document.addEventListener("keyup", e => { if (heldKeys.has(e.code)) { noteOff(heldKeys.get(e.code)); heldKeys.delete(e.code); } });

async function enableMidi() {
  if (!navigator.requestMIDIAccess) { S.midiInfo.textContent = "Web MIDI n’est pas disponible dans ce navigateur (essayez Chrome ou Edge)."; return; }
  try {
    const acc = await navigator.requestMIDIAccess({ sysex: false });
    const bind = () => { const names = []; for (const i of acc.inputs.values()) { i.onmidimessage = midiMsg; names.push(i.name); }
      S.midiInfo.textContent = names.length ? "Entrées : " + names.join(", ") : "Aucune entrée MIDI détectée."; };
    acc.onstatechange = bind; bind();
  } catch (e) { S.midiInfo.textContent = "Accès MIDI refusé : " + e.message; }
}
function midiMsg(ev) {
  const [st, a, b] = ev.data, c = st & 0xf0;
  if (st === 0xf8) { post({ t: "pulse" }); return; }
  if (st === 0xfa) { post({ t: "start" }); return; } if (st === 0xfb) { post({ t: "cont" }); return; } if (st === 0xfc) { post({ t: "stop" }); return; }
  if (c === 0x90 && b > 0) noteOn(a, b); else if (c === 0x80 || (c === 0x90 && b === 0)) noteOff(a);
  else if (c === 0xb0 && a === 1) { post({ t: "wheel", v: b * 258 }); $("#modW").value = b; }
  else if (c === 0xe0) post({ t: "bend", v: Math.round(((b << 7 | a) - 8192) / 8192 * 32767) });
  else if (c === 0xd0) post({ t: "after", v: a * 258 });
}

/* macro knobs: the 7 encoders of the FM-1, mapped to the most useful parameters */
function knob(name, label, fmt) {
  const [mn, mx] = S.range[name];
  const el = h("div", { class: "knob", tabindex: 0, role: "slider", "aria-label": label, "aria-valuemin": mn, "aria-valuemax": mx }, h("i"));
  const out = h("output", { text: "" });
  const upd = () => { const f = (S.p[name] - mn) / (mx - mn); el.firstChild.style.transform = "rotate(" + (-135 + f * 270) + "deg)"; out.textContent = fmt(S.p[name]); el.setAttribute("aria-valuenow", S.p[name]); };
  let y0 = 0, v0 = 0, drag = false;
  el.onpointerdown = e => { drag = true; y0 = e.clientY; v0 = S.p[name]; el.setPointerCapture(e.pointerId); };
  el.onpointermove = e => { if (drag) setParam(name, v0 + (y0 - e.clientY) / 160 * (mx - mn)); };
  el.onpointerup = el.onpointercancel = () => { drag = false; };
  el.onwheel = e => { e.preventDefault(); setParam(name, S.p[name] - Math.sign(e.deltaY) * (mx - mn) / 50); };
  el.onkeydown = e => { const d = e.key === "ArrowUp" || e.key === "ArrowRight" ? 1 : e.key === "ArrowDown" || e.key === "ArrowLeft" ? -1 : 0; if (d) { setParam(name, S.p[name] + d * (mx - mn) / 50); e.preventDefault(); } };
  reg(name, upd); upd();
  return h("div", { class: "mk" }, el, h("span", { text: label }), out);
}
function buildMacros() {
  $("#macros").append(knob("cutoff", "Coupure", hz), knob("res", "Résonance", pct), knob("env_amt", "Env→filtre", sgn), knob("env0_a", "Attaque", fsec), knob("env0_r", "Release", fsec), knob("drift", "Dérive", v => (v / 327.67).toFixed(0) + "%"), knob("master", "Volume", pct));
}

/* ------------------------------------------------------------ screen (scope) */
let analyser = null, scopeBuf = null;
function drawScreen() {
  const cv = $("#screen"), g = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const bg = cs.getPropertyValue("--lcd-bg").trim(), fg = cs.getPropertyValue("--lcd-fg").trim();
  g.fillStyle = bg; g.fillRect(0, 0, 240, 240); g.fillStyle = fg; g.strokeStyle = fg; g.font = "11px ui-monospace,Menlo,Consolas,monospace";
  g.fillText(S.name.slice(0, 22).toUpperCase(), 8, 16);
  const mode = ["PLAY", "ARP", "SEQ"][S.pmode] + (S.info[8] && S.pmode ? " >" : "");
  g.fillText(mode + "  " + (S.bpm10 / 10).toFixed(1) + " BPM", 8, 31);
  g.fillText("VOIX " + S.info[0] + "/" + S.p.nvoices + (S.p.mode ? " UNI" : "") + "  " + (S.p.poles === 4 ? "24dB" : "12dB"), 8, 46);
  g.beginPath(); g.moveTo(0, 54); g.lineTo(240, 54); g.stroke();
  if (analyser) { analyser.getFloatTimeDomainData(scopeBuf); let s = 0; for (let i = 1; i < scopeBuf.length - 1; i++) if (scopeBuf[i - 1] < 0 && scopeBuf[i] >= 0) { s = i; break; }
    g.beginPath(); for (let x = 0; x < 240; x++) { const v = scopeBuf[(s + x * 2) % scopeBuf.length] || 0, y = 112 - clamp(v * 2.2, -1, 1) * 46; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  else g.fillText("AUDIO ARRÊTÉ", 78, 112);
  g.beginPath(); g.moveTo(0, 162); g.lineTo(240, 162); g.stroke();
  const bar = (x, w, f, lab) => { g.strokeRect(x, 172, w, 10); g.fillRect(x, 172, w * clamp(f, 0, 1), 10); g.fillText(lab, x, 196); };
  bar(8, 64, S.p.cutoff / 33792, "CUT"); bar(88, 64, S.p.res / 32767, "RES"); bar(168, 64, S.p.master / 32767, "VOL");
  for (let l = 0; l < 4; l++) { const f = (S.info[4 + l] + 32767) / 65534; g.strokeRect(8 + l * 58, 206, 50, 8); g.fillRect(8 + l * 58 + 25 * 0, 206, 50 * clamp(f, 0, 1), 8); g.fillText("L" + (l + 1), 8 + l * 58, 230); }
  if (S.pmode === 2) { const n = clamp(S.p.pat_len, 1, 64); g.fillText("PAS " + (S.info[1] + 1) + "/" + n, 150, 230); }
  requestAnimationFrame(drawScreen);
}
function updateMisc() {
  if (S.updTransport) S.updTransport();
  $("#cMax").textContent = S.p.nvoices; $("#presetSel").value = $("#presetSel").value;
  for (let l = 0; l < 4; l++) (S.views["__lane" + l] || []).forEach(f => f());
  for (let i = 0; i < 12; i++) (S.views["__mx" + i] || []).forEach(f => f());
}
function uiTick() {
  $("#cVoices").textContent = S.info[0];
  const play = S.info[8] && S.pmode === 2 ? S.info[1] : -1;
  stepEls.forEach((el, i) => el.classList.toggle("play", i === play));
  for (let l = 0; l < 4; l++) if (S["laneOut" + l]) S["laneOut" + l].textContent = Math.round(S.info[4 + l] / 327.67) + " %";
  drawLanes(); litUpdate();
}

/* ------------------------------------------------------------ audio */
const WORKLET_SRC = `
${DMEngine.toString()}
class DM6Proc extends AudioWorkletProcessor {
  constructor(o) { super(); this.e = new DMEngine(o.processorOptions.module); this.c = 0;
    this.port.onmessage = ev => { this.e.handle(ev.data); };
    this.port.postMessage({ t: "ready" }); }
  process(inputs, outputs) { const o = outputs[0]; this.e.pull(o[0], o[1] || o[0], o[0].length, sampleRate);
    if ((this.c++ & 7) === 0) this.port.postMessage({ t: "info", v: this.e.info() }); return true; }
}
registerProcessor("dm6", DM6Proc);`;
async function startAudio() {
  const btn = $("#startBtn");
  if (S.started) { try { await S.ctx.close(); } catch (e) { } S.started = false; S.bus = null; analyser = null; btn.textContent = "▶ Démarrer l’audio"; btn.classList.add("primary"); return; }
  let ctx;
  try { ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100, latencyHint: "interactive" }); } catch (e) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  S.ctx = ctx; $("#cRate").textContent = ctx.sampleRate;
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; scopeBuf = new Float32Array(analyser.fftSize);
  analyser.connect(ctx.destination);
  let ok = false;
  try {
    const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "text/javascript" }));
    await ctx.audioWorklet.addModule(url);
    const node = new AudioWorkletNode(ctx, "dm6", { numberOfInputs: 0, outputChannelCount: [2], processorOptions: { module: probe.module } });
    node.port.onmessage = ev => { if (ev.data.t === "info") { S.info = ev.data.v; } };
    node.connect(analyser); S.bus = m => node.port.postMessage(m); ok = true;
  } catch (e) { console.warn("AudioWorklet indisponible, repli sur ScriptProcessor :", e); }
  if (!ok) {
    const eng = await DMEngine.create(bytes()), sp = ctx.createScriptProcessor(1024, 0, 2); let c = 0;
    sp.onaudioprocess = e => { eng.pull(e.outputBuffer.getChannelData(0), e.outputBuffer.getChannelData(1), 1024, ctx.sampleRate); if ((c++ & 1) === 0) S.info = eng.info(); };
    sp.connect(analyser); S.bus = m => eng.handle(m);
  }
  S.started = true; btn.textContent = "■ Arrêter l’audio"; btn.classList.remove("primary");
  await ctx.resume(); replay();
}

/* ------------------------------------------------------------ boot */
function buildTabs() {
  const defs = [["son", "Son"], ["mod", "Modulation"], ["seq", "Arpégiateur · Séquenceur"], ["cfg", "Jeu · MIDI · Patchs"]];
  const nav = $("#tabs");
  defs.forEach(([id, label], i) => {
    const b = h("button", { role: "tab", "aria-selected": i === 0 ? "true" : "false", text: label });
    b.onclick = () => { nav.querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", "false")); b.setAttribute("aria-selected", "true");
      defs.forEach(([k]) => { $("#tab-" + k).hidden = k !== id; }); if (id === "seq") drawLanes(); };
    nav.append(b);
  });
}
async function boot() {
  try { await initModel(); } catch (e) {
    const b = $("#banner"); b.hidden = false;
    b.textContent = "Le moteur WebAssembly n’a pas pu démarrer (" + e.message + "). Si vous voyez cette page dans un cadre restreint, ouvrez le fichier HTML en local : il est autonome.";
    return;
  }
  const sel = $("#presetSel"); Object.keys(PRESETS).forEach(k => sel.append(h("option", { value: k, text: k })));
  sel.onchange = () => applyPreset(sel.value);
  $("#startBtn").onclick = startAudio;
  $("#octDn").onclick = () => { S.base = clamp(S.base - 12, 12, 84); buildKb(); };
  $("#octUp").onclick = () => { S.base = clamp(S.base + 12, 12, 84); buildKb(); };
  $("#panicBtn").onclick = () => { S.lit.clear(); heldKeys.clear(); post({ t: "alloff" }); litUpdate(); };
  const bw = $("#bendW"); bw.oninput = () => post({ t: "bend", v: Math.round(bw.value / 100 * 32767) });
  const spring = () => { bw.value = 0; post({ t: "bend", v: 0 }); }; bw.onpointerup = spring; bw.onpointercancel = spring; bw.onkeyup = spring;
  $("#modW").oninput = e => post({ t: "wheel", v: Math.round(e.target.value * 258) });
  $("#themeBtn").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; drawLanes(); };
  buildTabs(); buildSound(); buildMod(); buildSeq(); buildCfg(); buildMacros(); buildKb();
  refreshAll(); drawScreen(); setInterval(uiTick, 60);
  $("#cRate").textContent = "44100";
}
const bootPromise = boot();
</script>
